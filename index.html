<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐾 우리 가족 동물 유형 테스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #FF6B6B;
    --secondary: #4ECDC4;
    --accent: #FFE66D;
    --bg: #FFF9F0;
    --text: #2D3436;
    --card: #FFFFFF;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  body {
    font-family: -apple-system, 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── Screens ── */
  .screen { display: none; min-height: 100dvh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ── Welcome ── */
  #welcome { justify-content: center; text-align: center; gap: 24px; }
  #welcome h1 { font-size: 2rem; line-height: 1.3; }
  #welcome .emoji-big { font-size: 4rem; }
  #welcome p { font-size: 1.05rem; color: #636e72; line-height: 1.6; }

  .btn {
    display: inline-block;
    padding: 16px 48px;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: white;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(135deg, var(--primary), #ee5a24); }
  .btn-secondary { background: linear-gradient(135deg, var(--secondary), #00b894); }
  .btn-small { padding: 10px 24px; font-size: 0.9rem; }

  /* ── Quiz ── */
  #quiz { justify-content: flex-start; padding-top: 40px; }

  .progress-bar {
    width: 100%; max-width: 500px;
    height: 8px; background: #dfe6e9; border-radius: 4px;
    margin-bottom: 12px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 4px; transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 0.85rem; color: #b2bec3; margin-bottom: 32px;
  }

  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 24px;
    width: 100%; max-width: 500px;
    text-align: center;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .q-number { font-size: 0.85rem; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 28px; line-height: 1.5; }

  .scale-labels {
    display: flex; justify-content: space-between;
    font-size: 0.82rem; color: #636e72; margin-bottom: 12px;
    max-width: 360px; margin-left: auto; margin-right: auto;
  }
  .scale-label { max-width: 120px; line-height: 1.3; }
  .scale-label.left { text-align: left; }
  .scale-label.right { text-align: right; }

  .scale-btns {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 8px;
  }
  .scale-btn {
    width: 52px; height: 52px;
    border-radius: 50%; border: 2.5px solid #dfe6e9;
    background: white; font-size: 1.05rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; color: #636e72;
  }
  .scale-btn:hover { border-color: var(--secondary); color: var(--secondary); }
  .scale-btn.selected {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-color: transparent; color: white; transform: scale(1.1);
  }

  .scale-desc {
    display: flex; justify-content: space-between;
    font-size: 0.7rem; color: #b2bec3;
    max-width: 320px; margin: 0 auto;
  }

  .nav-btns { display: flex; gap: 12px; margin-top: 24px; }

  /* ── Result ── */
  #result { justify-content: flex-start; padding-top: 32px; gap: 20px; }

  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 24px;
    width: 100%; max-width: 500px;
    text-align: center;
    animation: fadeIn 0.5s ease;
  }

  .animal-emoji { font-size: 5rem; margin-bottom: 8px; }
  .animal-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
  .type-code {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white; padding: 4px 16px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 700; margin-bottom: 16px;
  }
  .animal-desc { font-size: 0.95rem; color: #636e72; line-height: 1.7; margin-bottom: 24px; }

  .axis-bar { margin-bottom: 16px; text-align: left; }
  .axis-labels { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
  .axis-label { font-weight: 600; }
  .axis-label.active-trait { color: var(--primary); }
  .axis-track {
    height: 10px; background: #eee; border-radius: 5px;
    position: relative; overflow: hidden;
  }
  .axis-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--secondary), var(--primary));
    transition: width 1s ease;
  }
  .axis-pct {
    font-size: 0.75rem; color: #b2bec3; text-align: center; margin-top: 2px;
  }

  /* Name input */
  .name-section { margin-top: 12px; }
  .name-input {
    padding: 14px 20px; border: 2px solid #dfe6e9; border-radius: 12px;
    font-size: 1rem; width: 100%; max-width: 280px; text-align: center;
    outline: none; transition: border-color 0.2s;
  }
  .name-input:focus { border-color: var(--secondary); }
  .name-input::placeholder { color: #b2bec3; }

  .save-msg {
    margin-top: 8px; font-size: 0.85rem; color: var(--secondary);
    font-weight: 600; min-height: 20px;
  }

  /* ── Group Board ── */
  #group { padding-top: 32px; }
  #group h2 { font-size: 1.5rem; margin-bottom: 4px; }
  #group .subtitle { font-size: 0.9rem; color: #b2bec3; margin-bottom: 20px; }

  .board-actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }

  .family-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; width: 100%; max-width: 640px; margin-bottom: 24px;
  }
  .member-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 12px;
    text-align: center;
    animation: fadeIn 0.3s ease;
  }
  .member-emoji { font-size: 2.5rem; }
  .member-name { font-size: 0.95rem; font-weight: 700; margin: 4px 0 2px; }
  .member-animal { font-size: 0.8rem; color: #636e72; }
  .member-code { font-size: 0.7rem; color: var(--primary); font-weight: 600; }

  /* Stats */
  .stats-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    width: 100%; max-width: 640px;
    margin-bottom: 20px;
  }
  .stats-card h3 { font-size: 1.1rem; margin-bottom: 16px; }
  .stat-row { display: flex; align-items: center; margin-bottom: 12px; }
  .stat-label { width: 80px; font-size: 0.8rem; font-weight: 600; }
  .stat-track { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  .stat-fill-left {
    height: 100%; background: var(--secondary); border-radius: 4px;
    float: right; transition: width 0.8s;
  }
  .stat-fill-right {
    height: 100%; background: var(--primary); border-radius: 4px;
    transition: width 0.8s;
  }
  .stat-values { display: flex; justify-content: space-between; font-size: 0.7rem; color: #b2bec3; margin-top: 2px; }

  /* Manual add modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    justify-content: center; align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: var(--radius);
    padding: 28px; width: 90%; max-width: 360px;
    text-align: center;
  }
  .modal h3 { margin-bottom: 16px; }
  .modal input, .modal select {
    display: block; width: 100%; padding: 12px;
    border: 2px solid #dfe6e9; border-radius: 10px;
    font-size: 1rem; margin-bottom: 12px; outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: var(--secondary); }
  .modal-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }

  .btn-outline {
    padding: 10px 24px; border: 2px solid #dfe6e9; border-radius: 50px;
    background: white; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; color: var(--text); transition: all 0.2s;
  }
  .btn-outline:hover { border-color: var(--secondary); }

  /* empty state */
  .empty-state {
    text-align: center; padding: 40px 20px; color: #b2bec3;
  }
  .empty-state .emoji-big { font-size: 3rem; margin-bottom: 12px; }

  /* Tab bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    display: flex; z-index: 50;
  }
  .tab {
    flex: 1; padding: 10px 0 12px; text-align: center;
    font-size: 0.75rem; font-weight: 600; color: #b2bec3;
    cursor: pointer; border: none; background: none;
    transition: color 0.2s;
  }
  .tab .tab-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }
  .tab.active { color: var(--primary); }

  /* Utility */
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .text-center { text-align: center; }
  .gap-8 { gap: 8px; }

  /* Bottom safe area for tab bar */
  .screen { padding-bottom: 80px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #2d3436; color: white; padding: 12px 24px;
    border-radius: 12px; font-size: 0.9rem; font-weight: 600;
    z-index: 200; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Compatibility section */
  .compat-section { width: 100%; max-width: 640px; margin-bottom: 24px; }
  .compat-select {
    padding: 10px 16px; border: 2px solid #dfe6e9; border-radius: 10px;
    font-size: 0.95rem; outline: none; background: white;
    min-width: 120px;
  }
  .compat-select:focus { border-color: var(--secondary); }
  .compat-result {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-top: 12px;
    text-align: center; display: none;
  }
  .compat-result.active { display: block; }
  .compat-score { font-size: 2.5rem; font-weight: 800; }
  .compat-detail { font-size: 0.9rem; color: #636e72; line-height: 1.6; margin-top: 8px; }

  /* Awards */
  .award-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid #f0f0f0;
  }
  .award-item:last-child { border-bottom: none; }
  .award-icon { font-size: 2rem; width: 48px; text-align: center; flex-shrink: 0; }
  .award-info { flex: 1; }
  .award-title { font-size: 0.8rem; color: var(--primary); font-weight: 700; }
  .award-winner { font-size: 1.05rem; font-weight: 800; }
  .award-reason { font-size: 0.8rem; color: #636e72; margin-top: 2px; }

  /* Same type group */
  .type-group { margin-bottom: 16px; }
  .type-group-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 1rem; font-weight: 700; margin-bottom: 8px;
  }
  .type-group-members {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .type-group-chip {
    background: linear-gradient(135deg, #fff9f0, #ffe8e0);
    padding: 6px 14px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 600;
  }

  /* Unique type */
  .unique-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #f0f0f0;
  }
  .unique-item:last-child { border-bottom: none; }
  .unique-emoji { font-size: 1.8rem; }
  .unique-info { flex: 1; }
  .unique-name { font-weight: 700; font-size: 0.95rem; }
  .unique-desc { font-size: 0.8rem; color: #636e72; }

  /* Compat ranking */
  .compat-rank-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid #f0f0f0;
  }
  .compat-rank-item:last-child { border-bottom: none; }
  .rank-badge {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 800; color: white; flex-shrink: 0;
  }
  .rank-1 { background: linear-gradient(135deg, #f9ca24, #f0932b); }
  .rank-2 { background: linear-gradient(135deg, #dfe6e9, #b2bec3); }
  .rank-3 { background: linear-gradient(135deg, #e17055, #d63031); }
  .rank-best { background: linear-gradient(135deg, #fd79a8, #e84393); }
  .rank-worst { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  .rank-info { flex: 1; }
  .rank-names { font-weight: 700; font-size: 0.95rem; }
  .rank-comment { font-size: 0.8rem; color: #636e72; margin-top: 2px; }
  .rank-score { font-weight: 800; font-size: 1.1rem; color: var(--primary); }

  @media (max-width: 380px) {
    .scale-btn { width: 44px; height: 44px; font-size: 0.95rem; }
    .scale-btns { gap: 8px; }
    .q-text { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<!-- ════════════ Welcome Screen ════════════ -->
<div id="welcome" class="screen active">
  <div class="emoji-big">🐾</div>
  <h1>우리 가족<br>동물 유형 테스트</h1>
  <p>16가지 질문으로 알아보는<br>나의 성격 동물 캐릭터!<br><br>🕐 약 4분 소요</p>
  <button class="btn btn-primary" onclick="startQuiz()">테스트 시작하기</button>
  <button class="btn btn-secondary btn-small" onclick="showScreen('group')" style="margin-top:8px;">그룹 보드 바로가기</button>
</div>

<!-- ════════════ Quiz Screen ════════════ -->
<div id="quiz" class="screen">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">1 / 16</div>
  <div class="question-card" id="questionCard">
    <div class="q-number" id="qNumber"></div>
    <div class="q-text" id="qText"></div>
    <div class="scale-labels">
      <div class="scale-label left" id="labelLeft"></div>
      <div class="scale-label right" id="labelRight"></div>
    </div>
    <div class="scale-btns" id="scaleBtns"></div>
    <div class="scale-desc">
      <span>매우 그렇다</span>
      <span>보통</span>
      <span>매우 그렇다</span>
    </div>
  </div>
  <div class="nav-btns">
    <button class="btn-outline" id="prevBtn" onclick="prevQuestion()" style="display:none;">← 이전</button>
  </div>
</div>

<!-- ════════════ Result Screen ════════════ -->
<div id="result" class="screen">
  <div class="result-card">
    <div class="animal-emoji" id="resultEmoji"></div>
    <div class="animal-name" id="resultName"></div>
    <div class="type-code" id="resultCode"></div>
    <div class="animal-desc" id="resultDesc"></div>

    <div id="axisBars"></div>
  </div>

  <div class="result-card name-section">
    <p style="font-weight:700; margin-bottom:12px;">이름을 입력하고 가족 보드에 등록하세요!</p>
    <input type="text" class="name-input" id="nameInput" placeholder="이름 입력" maxlength="10">
    <div style="margin-top:12px;">
      <button class="btn btn-primary btn-small" onclick="saveToServer()">저장하기</button>
    </div>
    <div class="save-msg" id="saveMsg"></div>
  </div>

  <button class="btn btn-secondary btn-small" onclick="resetQuiz()">다시 테스트하기</button>
</div>

<!-- ════════════ Group Board Screen ════════════ -->
<div id="group" class="screen">
  <h2>🏠 가족 보드</h2>
  <p class="subtitle">우리 가족의 동물 유형을 한눈에!</p>

  <div class="board-actions">
    <button class="btn-outline" onclick="loadFromServer()">🔄 서버에서 불러오기</button>
    <button class="btn-outline" onclick="openAddModal()">➕ 직접 추가</button>
    <button class="btn-outline" onclick="clearBoard()">🗑️ 초기화</button>
  </div>

  <div class="family-grid" id="familyGrid"></div>

  <!-- 가족 어워드 -->
  <div class="stats-card" id="awardsSection" style="display:none;">
    <h3>🏅 가족 어워드</h3>
    <p style="font-size:0.85rem;color:#636e72;margin-bottom:16px;">우리 가족의 특별한 타이틀!</p>
    <div id="awardsContent"></div>
  </div>

  <!-- 같은 유형 가족 묶기 -->
  <div class="stats-card" id="sameTypeSection" style="display:none;">
    <h3>🐾 같은 유형 가족</h3>
    <div id="sameTypeContent"></div>
  </div>

  <!-- 유일한 유형 -->
  <div class="stats-card" id="uniqueTypeSection" style="display:none;">
    <h3>⭐ 우리 가족의 특별한 존재</h3>
    <div id="uniqueTypeContent"></div>
  </div>

  <!-- 베스트 / 워스트 궁합 -->
  <div class="stats-card" id="autoCompatSection" style="display:none;">
    <h3>🏆 궁합 랭킹</h3>
    <div id="autoCompatContent"></div>
  </div>

  <div class="stats-card" id="familyStats" style="display:none;">
    <h3>📊 우리 가족 성향 분포</h3>
    <div id="statsContent"></div>
  </div>

  <!-- 궁합 직접 보기 -->
  <div class="compat-section" id="compatSection" style="display:none;">
    <div class="stats-card">
      <h3>💕 궁합 직접 보기</h3>
      <div style="display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap;">
        <select class="compat-select" id="compat1"></select>
        <span style="font-size:1.2rem;">💕</span>
        <select class="compat-select" id="compat2"></select>
        <button class="btn btn-primary btn-small" onclick="showCompat()">보기</button>
      </div>
      <div class="compat-result" id="compatResult">
        <div class="compat-score" id="compatScore"></div>
        <div class="compat-detail" id="compatDetail"></div>
      </div>
    </div>
  </div>
</div>

<!-- ════════════ Add Member Modal ════════════ -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>가족 구성원 추가</h3>
    <input type="text" id="addName" placeholder="이름" maxlength="10">
    <select id="addType"></select>
    <div class="modal-btns">
      <button class="btn-outline" onclick="closeAddModal()">취소</button>
      <button class="btn btn-primary btn-small" onclick="addMember()">추가</button>
    </div>
  </div>
</div>

<!-- ════════════ Tab Bar ════════════ -->
<div class="tab-bar">
  <button class="tab active" onclick="showScreen('welcome')" id="tabHome">
    <span class="tab-icon">🏠</span>홈
  </button>
  <button class="tab" onclick="showScreen('group')" id="tabGroup">
    <span class="tab-icon">👨‍👩‍👧‍👦</span>가족보드
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ════════════ Config Modal ════════════ -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h3>⚙️ 서버 설정</h3>
    <p style="font-size:0.85rem; color:#636e72; margin-bottom:12px;">Google Apps Script 웹앱 URL을 입력하세요</p>
    <input type="text" id="serverUrl" placeholder="https://script.google.com/macros/s/...">
    <div class="modal-btns">
      <button class="btn-outline" onclick="closeConfigModal()">취소</button>
      <button class="btn btn-primary btn-small" onclick="saveConfig()">저장</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// Data
// ══════════════════════════════════════

const questions = [
  // 축1: 에너지 I(1) vs E(5)
  { axis: 0, text: "여행지에서 자유시간이 주어진다면?", left: "혼자 조용히 산책하고 싶다", right: "다 같이 어울려 놀고 싶다" },
  { axis: 0, text: "처음 보는 사람과 함께하게 되면?", left: "일단 지켜보면서 천천히 다가간다", right: "먼저 말을 걸고 친해진다" },

// ══════════════════════════════════════
// State
// ══════════════════════════════════════
let currentQ = 0;
let answers = new Array(16).fill(0); // 0 = unanswered
let myResult = null;

// ══════════════════════════════════════
// Screen Management
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabMap = { welcome: 'tabHome', quiz: 'tabHome', result: 'tabHome', group: 'tabGroup' };
  if (tabMap[id]) document.getElementById(tabMap[id]).classList.add('active');
  if (id === 'group') renderBoard();
  window.scrollTo(0, 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════
// Quiz Logic
// ══════════════════════════════════════
function startQuiz() {
  currentQ = 0;
  answers.fill(0);
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNumber').textContent = `Q${currentQ + 1}`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('labelLeft').textContent = q.left;
  document.getElementById('labelRight').textContent = q.right;
  document.getElementById('progressFill').style.width = `${((currentQ) / 16) * 100}%`;
  document.getElementById('progressText').textContent = `${currentQ + 1} / 16`;
  document.getElementById('prevBtn').style.display = currentQ > 0 ? 'inline-block' : 'none';

  const container = document.getElementById('scaleBtns');
  container.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.className = 'scale-btn' + (answers[currentQ] === i ? ' selected' : '');
    btn.textContent = i;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  }

  // Re-trigger animation
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeIn 0.3s ease';
}

function selectAnswer(val) {
  answers[currentQ] = val;
  // Highlight selected
  document.querySelectorAll('.scale-btn').forEach((btn, idx) => {
    btn.classList.toggle('selected', idx + 1 === val);
  });
  // Auto-advance after short delay
  setTimeout(() => {
    if (currentQ < 15) {
      currentQ++;
      renderQuestion();
    } else {
      calculateResult();
    }
  }, 300);
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

// ══════════════════════════════════════
// Calculate Result
// ══════════════════════════════════════
function calculateResult() {
  // Sum scores per axis
  const axisSums = [0, 0, 0, 0];
  const axisCounts = [0, 0, 0, 0];

  questions.forEach((q, i) => {
    if (answers[i] > 0) {
      axisSums[q.axis] += answers[i];
      axisCounts[q.axis]++;
    }
  });

  // Average per axis (1-5 scale)
  const axisAvg = axisSums.map((sum, i) => axisCounts[i] > 0 ? sum / axisCounts[i] : 3);

  // Determine type code
  // axis0: <3 → I, >=3 → E  (but exactly 3 leans left trait for axes 0,2, right for 1,3 — for fun variation)
  let code = '';
  for (let i = 0; i < 4; i++) {
    // For activity axis (3), 1=Active, 5=Rest, so low=A high=R
    // All axes: low score = first letter, high = second letter
    code += axisAvg[i] < 3 ? axisKeys[i][0] : axisAvg[i] > 3 ? axisKeys[i][1] : axisKeys[i][0];
  }

  // Percentages: how much toward second trait (right side)
  // 1 → 0%, 3 → 50%, 5 → 100%
  const axisPercent = axisAvg.map(avg => Math.round(((avg - 1) / 4) * 100));

  const animal = animalTypes[code];
  myResult = { code, axisAvg, axisPercent, animal };

  renderResult();
  showScreen('result');
}

function renderResult() {
  if (!myResult) return;
  const { code, axisPercent, animal } = myResult;

  document.getElementById('resultEmoji').textContent = animal.emoji;
  document.getElementById('resultName').textContent = animal.name;
  document.getElementById('resultCode').textContent = code;
  document.getElementById('resultDesc').textContent = animal.desc;

  // Axis bars
  const barsHtml = axisNames.map((names, i) => {
    const rightPct = axisPercent[i];
    const leftPct = 100 - rightPct;
    const isRight = rightPct >= 50;
    return `
      <div class="axis-bar">
        <div class="axis-labels">
          <span class="axis-label ${!isRight ? 'active-trait' : ''}">${names[0]}</span>
          <span class="axis-label ${isRight ? 'active-trait' : ''}">${names[1]}</span>
        </div>
        <div class="axis-track">
          <div class="axis-fill" style="width:${rightPct}%"></div>
        </div>
        <div class="axis-pct">${leftPct}% : ${rightPct}%</div>
      </div>`;
  }).join('');
  document.getElementById('axisBars').innerHTML = barsHtml;

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.axis-fill').forEach(el => { el.style.width = el.style.width; });
  }, 100);
}

// ══════════════════════════════════════
// Save / Load
// ══════════════════════════════════════
function getMembers() {
  try { return JSON.parse(localStorage.getItem('familyMembers') || '[]'); }
  catch { return []; }
}

function setMembers(list) {
  localStorage.setItem('familyMembers', JSON.stringify(list));
}

function saveResult() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('이름을 입력해주세요!'); return; }
  if (!myResult) return;

  const members = getMembers();
  const existing = members.findIndex(m => m.name === name);
  const entry = {
    name,
    code: myResult.code,
    emoji: myResult.animal.emoji,
    animalName: myResult.animal.name,
    axisPercent: myResult.axisPercent,
    timestamp: new Date().toISOString()
  };
  if (existing >= 0) members[existing] = entry;
  else members.push(entry);
  setMembers(members);

  document.getElementById('saveMsg').textContent = `✅ ${name}님 저장 완료!`;
  showToast('저장되었습니다!');
}

function resetQuiz() {
  currentQ = 0;
  answers.fill(0);
  myResult = null;
  document.getElementById('nameInput').value = '';
  document.getElementById('saveMsg').textContent = '';
  showScreen('welcome');
}

// ══════════════════════════════════════
// Server (Google Apps Script)
// ══════════════════════════════════════
function getServerUrl() {
  return localStorage.getItem('serverUrl') || 'https://script.google.com/macros/s/AKfycbzSLlD_7DlNRo3L-Ds0mQDXKGksR866JfXno9QDUp5bEGgLWn4ZGSNvE1AN5s9alx2twg/exec';
}

function saveToServer() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('이름을 입력해주세요!'); return; }
  if (!myResult) return;

  const url = getServerUrl();
  if (!url) { openConfigModal(); return; }

  const data = {
    action: 'save',
    name,
    code: myResult.code,
    emoji: myResult.animal.emoji,
    animalName: myResult.animal.name,
    axisPercent: myResult.axisPercent
  };

  showToast('저장 중...');

  // 로컬 저장
  saveResult();

  // 서버 저장
  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById('saveMsg').textContent = `✅ ${name}님 저장 완료!`;
    showToast('저장되었습니다!');
  }).catch(err => {
    document.getElementById('saveMsg').textContent = `⚠️ 로컬 저장됨 (서버 연결 실패)`;
    showToast('로컬에 저장됨 (서버 오류)');
  });
}

function loadFromServer() {
  const url = getServerUrl();
  if (!url) { openConfigModal(); return; }

  showToast('불러오는 중...');

  fetch(url + '?action=load')
    .then(r => r.json())
    .then(data => {
      if (data && data.members) {
        setMembers(data.members);
        renderBoard();
        showToast(`${data.members.length}명 불러왔습니다!`);
      } else {
        showToast('데이터가 없습니다.');
      }
    })
    .catch(err => {
      showToast('불러오기 실패: ' + err.message);
    });
}

// Config modal
function openConfigModal() { document.getElementById('configModal').classList.add('active'); document.getElementById('serverUrl').value = getServerUrl(); }
function closeConfigModal() { document.getElementById('configModal').classList.remove('active'); }
function saveConfig() {
  const url = document.getElementById('serverUrl').value.trim();
  localStorage.setItem('serverUrl', url);
  closeConfigModal();
  showToast('서버 URL 저장됨!');
}

// ══════════════════════════════════════
// Group Board
// ══════════════════════════════════════
function renderBoard() {
  const members = getMembers();
  const grid = document.getElementById('familyGrid');
  const stats = document.getElementById('familyStats');
  const compat = document.getElementById('compatSection');
  const awards = document.getElementById('awardsSection');
  const sameType = document.getElementById('sameTypeSection');
  const uniqueType = document.getElementById('uniqueTypeSection');
  const autoCompat = document.getElementById('autoCompatSection');

  const hideSections = () => {
    [stats, compat, awards, sameType, uniqueType, autoCompat].forEach(el => el.style.display = 'none');
  };

  if (members.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="emoji-big">🐾</div>
      <p>아직 등록된 가족이 없어요.<br>테스트를 하거나 직접 추가해보세요!</p>
    </div>`;
    hideSections();
    return;
  }

  grid.innerHTML = members.map(m => `
    <div class="member-card">
      <div class="member-emoji">${m.emoji}</div>
      <div class="member-name">${m.name}</div>
      <div class="member-animal">${m.animalName}</div>
      <div class="member-code">${m.code}</div>
    </div>
  `).join('');

  if (members.length >= 2) {
    renderAwards(members);
    renderSameTypes(members);
    renderUniqueTypes(members);
    renderAutoCompat(members);
    stats.style.display = 'block';
    renderStats(members);
    compat.style.display = 'block';
    renderCompatSelects(members);
  } else {
    hideSections();
  }
}

function renderStats(members) {
  const validMembers = members.filter(m => m.axisPercent && m.axisPercent.length === 4);
  if (validMembers.length === 0) { document.getElementById('familyStats').style.display = 'none'; return; }

  const avgPct = [0, 0, 0, 0];
  validMembers.forEach(m => m.axisPercent.forEach((p, i) => avgPct[i] += p));
  avgPct.forEach((_, i) => avgPct[i] = Math.round(avgPct[i] / validMembers.length));

  const html = axisNames.map((names, i) => {
    const rightPct = avgPct[i];
    const leftPct = 100 - rightPct;
    return `
      <div class="stat-row">
        <div class="stat-label">${names[0].split('(')[0].trim()}</div>
        <div style="flex:1;">
          <div class="stat-track"><div class="stat-fill-right" style="width:${rightPct}%"></div></div>
          <div class="stat-values"><span>${leftPct}%</span><span>${rightPct}%</span></div>
        </div>
        <div class="stat-label" style="text-align:right;">${names[1].split('(')[0].trim()}</div>
      </div>`;
  }).join('');

  document.getElementById('statsContent').innerHTML = html;
}

function renderCompatSelects(members) {
  const opts = members.map((m, i) => `<option value="${i}">${m.name} ${m.emoji}</option>`).join('');
  document.getElementById('compat1').innerHTML = opts;
  document.getElementById('compat2').innerHTML = opts;
  if (members.length > 1) document.getElementById('compat2').selectedIndex = 1;
  document.getElementById('compatResult').classList.remove('active');
}

// ── 궁합 계산 공통 함수 ──
const compatComments = {
  similar: [
    ["에너지", "둘 다 비슷한 방식으로 에너지를 충전해요! 함께 있을 때 편안한 사이 💛"],
    ["스타일", "여행 스타일이 척척 맞아요! 같이 여행하면 환상의 호흡 🧳"],
    ["판단", "생각하는 방식이 통해요! 의견이 잘 맞아 대화가 즐거운 사이 🗣️"],
    ["활동", "활동 템포가 딱 맞아요! 같이 움직이면 지치지 않는 조합 🏃"]
  ],
  different: [
    ["에너지", "한 명은 충전 중, 한 명은 파티 중! 😄 서로의 리듬을 존중하면 최고의 밸런스!"],
    ["스타일", "계획 vs 즉흥의 만남! 🎲 한 명이 길을 잡고 한 명이 재미를 더해요!"],
    ["판단", "머리 vs 마음의 환상 콤비! 🧠💗 서로 놓치는 부분을 딱 채워줘요!"],
    ["활동", "움직이는 사람 + 쉬는 사람 = 완벽한 여행! 🏖️ 번갈아 리드해봐요!"]
  ],
  overall: {
    90: ["소울메이트급! 🥹", "말 안 해도 통하는 사이! 전생에 한 가족이었던 게 아닐까요?"],
    80: ["찰떡궁합! 💖", "함께 있으면 편하고 즐거운 천생연분 조합이에요!"],
    70: ["좋은 궁합! 💕", "서로 잘 맞는 부분이 많아요. 함께하면 시너지가 납니다!"],
    60: ["훈훈한 사이 😊", "비슷한 점도 다른 점도 있어서 대화거리가 끊이지 않아요!"],
    50: ["재미있는 조합! 🤝", "다른 점이 있어서 오히려 서로에게 배울 점이 많아요!"],
    40: ["정반대 매력! 🌈", "다르기 때문에 특별한 조합! 서로의 세계를 넓혀줘요!"],
    0:  ["극과 극은 통한다! ⚡", "완전 다른 스타일이지만, 그래서 함께하면 더 완벽해져요!"]
  }
};

function calcCompatScore(m1, m2) {
  if (!m1.axisPercent || !m2.axisPercent) return null;
  let totalDiff = 0;
  const axisDiffs = [];
  m1.axisPercent.forEach((p1, i) => {
    const diff = Math.abs(p1 - m2.axisPercent[i]);
    totalDiff += diff;
    axisDiffs.push(diff);
  });
  return { score: Math.max(0, Math.round(100 - (totalDiff / 4))), axisDiffs };
}

function getOverallComment(score) {
  const thresholds = [90, 80, 70, 60, 50, 40, 0];
  for (const t of thresholds) {
    if (score >= t) return compatComments.overall[t];
  }
  return compatComments.overall[0];
}

function showCompat() {
  const members = getMembers();
  const i1 = parseInt(document.getElementById('compat1').value);
  const i2 = parseInt(document.getElementById('compat2').value);
  if (i1 === i2) { showToast('다른 사람을 선택해주세요!'); return; }

  const m1 = members[i1], m2 = members[i2];
  const result = calcCompatScore(m1, m2);
  if (!result) { showToast('점수 데이터가 없습니다.'); return; }

  const { score, axisDiffs } = result;
  const details = axisDiffs.map((diff, i) => {
    const comments = diff <= 25 ? compatComments.similar[i] : compatComments.different[i];
    const icon = diff <= 25 ? '✅' : '💡';
    return `${icon} <strong>${comments[0]}</strong>: ${comments[1]}`;
  });

  const [title, comment] = getOverallComment(score);

  document.getElementById('compatScore').innerHTML = `${title}<br><span style="font-size:3rem;">${score}%</span>`;
  document.getElementById('compatDetail').innerHTML =
    `<strong>${m1.name}</strong> ${m1.emoji} × <strong>${m2.name}</strong> ${m2.emoji}<br>` +
    `<p style="margin:8px 0;color:#636e72;">${comment}</p>` +
    `<div style="text-align:left;margin-top:12px;">${details.join('<br><br>')}</div>`;
  document.getElementById('compatResult').classList.add('active');
}

// ── 가족 어워드 ──
function renderAwards(members) {
  const section = document.getElementById('awardsSection');
  const valid = members.filter(m => m.axisPercent && m.axisPercent.length === 4);
  if (valid.length < 2) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  const awardList = [];

  // 축 인덱스: 0=에너지(I/E), 1=스타일(P/S), 2=판단(F/T), 3=활동(A/R)
  // axisPercent: 높을수록 E, S, T, R

  // 1. 제일 열정적인 사람 (활동 축 가장 낮은 = 가장 활동적)
  const mostActive = [...valid].sort((a, b) => a.axisPercent[3] - b.axisPercent[3])[0];
  awardList.push({
    icon: "🔥",
    title: "불꽃 열정상",
    winner: `${mostActive.name} ${mostActive.emoji}`,
    reason: "가만히 있으면 몸이 근질근질! 우리 가족 에너자이저 🔋 이 사람 없으면 여행이 심심해져요!"
  });

  // 2. 제일 친화적인 사람 (에너지 축 가장 높은 = 가장 E)
  const mostSocial = [...valid].sort((a, b) => b.axisPercent[0] - a.axisPercent[0])[0];
  awardList.push({
    icon: "🤗",
    title: "인간 비타민상",
    winner: `${mostSocial.name} ${mostSocial.emoji}`,
    reason: "옆에 있으면 자동으로 기분이 좋아지는 마법의 사람! 가족 분위기 담당 매니저 🎪"
  });

  // 3. 제일 긍정적인 사람 (즉흥 높고 + 활동 높은 = S+A 콤보)
  const mostPositive = [...valid].sort((a, b) => {
    const scoreA = a.axisPercent[1] + (100 - a.axisPercent[3]); // 즉흥 + 활동
    const scoreB = b.axisPercent[1] + (100 - b.axisPercent[3]);
    return scoreB - scoreA;
  })[0];
  awardList.push({
    icon: "☀️",
    title: "긍정왕 선샤인상",
    winner: `${mostPositive.name} ${mostPositive.emoji}`,
    reason: "\"어떻게든 되겠지~\" 이 한마디로 가족을 안심시키는 태양같은 존재! 걱정은 이 사람이 다 녹여줘요 🌞"
  });

  // 4. 제일 꼼꼼한 사람 (계획 축 가장 낮은 = 가장 P)
  const mostPlanner = [...valid].sort((a, b) => a.axisPercent[1] - b.axisPercent[1])[0];
  awardList.push({
    icon: "📋",
    title: "살림꾼 총무상",
    winner: `${mostPlanner.name} ${mostPlanner.emoji}`,
    reason: "이 사람 덕분에 가족 여행이 매끄럽게 굴러갑니다! 체크리스트의 신, 잊어버리는 거 없이 다 챙겨요 📦"
  });

  // 5. 가장 감성적인 사람 (판단 축 가장 낮은 = 가장 F)
  const mostFeeling = [...valid].sort((a, b) => a.axisPercent[2] - b.axisPercent[2])[0];
  awardList.push({
    icon: "💝",
    title: "감동 제조기상",
    winner: `${mostFeeling.name} ${mostFeeling.emoji}`,
    reason: "가족 사진 보다가 혼자 울컥하는 타입! 가족의 따뜻한 감성을 책임지는 감동 메이커 🥹"
  });

  // 6. 가장 쿨한 사람 (판단 축 가장 높은 = 가장 T)
  const mostCool = [...valid].sort((a, b) => b.axisPercent[2] - a.axisPercent[2])[0];
  awardList.push({
    icon: "🧊",
    title: "쿨내진동상",
    winner: `${mostCool.name} ${mostCool.emoji}`,
    reason: "감정에 휘둘리지 않는 냉철한 판단력! 가족 회의 때 결론을 내주는 해결사 🎯"
  });

  // 7. 베스트 커플
  const pairs = [];
  for (let i = 0; i < valid.length; i++) {
    for (let j = i + 1; j < valid.length; j++) {
      const result = calcCompatScore(valid[i], valid[j]);
      if (result) pairs.push({ m1: valid[i], m2: valid[j], ...result });
    }
  }
  if (pairs.length > 0) {
    pairs.sort((a, b) => b.score - a.score);
    const best = pairs[0];
    awardList.push({
      icon: "💕",
      title: "베스트 궁합상",
      winner: `${best.m1.name} ${best.m1.emoji} × ${best.m2.name} ${best.m2.emoji}`,
      reason: `궁합 ${best.score}%! 말 안 해도 척하면 척! 우리 가족 최고의 찰떡 콤비 🥇`
    });

    // 8. 워스트 커플 (반전 매력)
    const worst = pairs[pairs.length - 1];
    awardList.push({
      icon: "⚡",
      title: "극과극 반전매력상",
      winner: `${worst.m1.name} ${worst.m1.emoji} × ${worst.m2.name} ${worst.m2.emoji}`,
      reason: `궁합 ${worst.score}%! 완전 다르지만 그래서 더 흥미진진! 이 둘이 만나면 예측불가 시트콤이 시작돼요 🎬`
    });
  }

  const html = awardList.map(a => `
    <div class="award-item">
      <div class="award-icon">${a.icon}</div>
      <div class="award-info">
        <div class="award-title">${a.title}</div>
        <div class="award-winner">${a.winner}</div>
        <div class="award-reason">${a.reason}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('awardsContent').innerHTML = html;
}

// ── 같은 유형 가족 묶기 ──
function renderSameTypes(members) {
  const section = document.getElementById('sameTypeSection');
  const groups = {};
  members.forEach(m => {
    if (!groups[m.code]) groups[m.code] = [];
    groups[m.code].push(m);
  });

  const sameGroups = Object.entries(groups).filter(([_, arr]) => arr.length >= 2);
  if (sameGroups.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  const html = sameGroups.map(([code, arr]) => {
    const animal = animalTypes[code];
    return `
      <div class="type-group">
        <div class="type-group-header">
          <span style="font-size:1.5rem;">${animal.emoji}</span>
          <span>${animal.name} (${code})</span>
          <span style="color:var(--primary);font-size:0.85rem;">${arr.length}명</span>
        </div>
        <div class="type-group-members">
          ${arr.map(m => `<span class="type-group-chip">${m.name}</span>`).join('')}
        </div>
        <p style="font-size:0.82rem;color:#636e72;margin-top:6px;">
          ${getGroupComment(arr)}
        </p>
      </div>`;
  }).join('');

  document.getElementById('sameTypeContent').innerHTML = html;
}

function getGroupComment(arr) {
  const names = arr.map(m => m.name);
  if (names.length === 2) return `${names[0]}님과 ${names[1]}님은 같은 유형! 서로 가장 잘 이해하는 사이예요 🤜🤛`;
  return `${names.join(', ')} — 무려 ${names.length}명이 같은 유형! 통하는 게 많을 수밖에 없는 팀이에요! 🎉`;
}

// ── 유일한 유형 ──
function renderUniqueTypes(members) {
  const section = document.getElementById('uniqueTypeSection');
  const groups = {};
  members.forEach(m => {
    if (!groups[m.code]) groups[m.code] = [];
    groups[m.code].push(m);
  });

  const uniques = Object.entries(groups)
    .filter(([_, arr]) => arr.length === 1)
    .map(([code, arr]) => arr[0]);

  if (uniques.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  const uniqueMessages = [
    "우리 가족에서 유일한 유형! 특별한 시각으로 가족에 새로운 바람을 불어넣는 존재예요 ✨",
    "이 유형은 오직 한 명! 가족 안에서 대체 불가능한 특별한 역할을 해요 🌟",
    "우리 가족의 히든카드! 다른 누구도 가지지 못한 독보적인 매력의 소유자 💎",
    "가족 중 유일무이한 존재! 이 사람이 없으면 가족 퍼즐이 완성되지 않아요 🧩",
    "한 명뿐인 특별한 유형! 가족에게 다양성과 새로운 관점을 선물하는 사람 🎁"
  ];

  const html = uniques.map((m, i) => {
    const animal = animalTypes[m.code];
    return `
      <div class="unique-item">
        <div class="unique-emoji">${animal.emoji}</div>
        <div class="unique-info">
          <div class="unique-name">${m.name} — ${animal.name}</div>
          <div class="unique-desc">${uniqueMessages[i % uniqueMessages.length]}</div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('uniqueTypeContent').innerHTML = html;
}

// ── 베스트 / 워스트 궁합 자동 계산 ──
function renderAutoCompat(members) {
  const section = document.getElementById('autoCompatSection');
  const validMembers = members.filter(m => m.axisPercent && m.axisPercent.length === 4);
  if (validMembers.length < 2) { section.style.display = 'none'; return; }

  // 모든 조합 계산
  const pairs = [];
  for (let i = 0; i < validMembers.length; i++) {
    for (let j = i + 1; j < validMembers.length; j++) {
      const result = calcCompatScore(validMembers[i], validMembers[j]);
      if (result) {
        pairs.push({ m1: validMembers[i], m2: validMembers[j], ...result });
      }
    }
  }

  if (pairs.length === 0) { section.style.display = 'none'; return; }

  pairs.sort((a, b) => b.score - a.score);

  section.style.display = 'block';

  // 상위 3 + 하위 1
  const best3 = pairs.slice(0, 3);
  const worst1 = pairs[pairs.length - 1];

  let html = '<p style="font-size:0.85rem;color:#636e72;margin-bottom:12px;">우리 가족 궁합 TOP 3와 반전 매력 조합!</p>';

  best3.forEach((p, idx) => {
    const [title] = getOverallComment(p.score);
    html += `
      <div class="compat-rank-item">
        <div class="rank-badge rank-${idx + 1}">${idx + 1}</div>
        <div class="rank-info">
          <div class="rank-names">${p.m1.name} ${p.m1.emoji} × ${p.m2.name} ${p.m2.emoji}</div>
          <div class="rank-comment">${title}</div>
        </div>
        <div class="rank-score">${p.score}%</div>
      </div>`;
  });

  // 워스트 (반전 매력)
  if (worst1 && worst1 !== best3[best3.length - 1]) {
    html += `
      <div style="margin-top:16px;padding-top:12px;border-top:2px dashed #dfe6e9;">
        <p style="font-size:0.9rem;font-weight:700;margin-bottom:8px;">🌈 반전 매력 조합</p>
        <div class="compat-rank-item">
          <div class="rank-badge rank-worst">!</div>
          <div class="rank-info">
            <div class="rank-names">${worst1.m1.name} ${worst1.m1.emoji} × ${worst1.m2.name} ${worst1.m2.emoji}</div>
            <div class="rank-comment">극과 극은 통한다! 가장 다른 만큼 서로에게 가장 많이 배울 수 있는 조합 ⚡</div>
          </div>
          <div class="rank-score">${worst1.score}%</div>
        </div>
      </div>`;
  }

  document.getElementById('autoCompatContent').innerHTML = html;
}

// ══════════════════════════════════════
// Manual Add
// ══════════════════════════════════════
function openAddModal() {
  document.getElementById('addModal').classList.add('active');
  const sel = document.getElementById('addType');
  sel.innerHTML = Object.entries(animalTypes).map(([code, a]) =>
    `<option value="${code}">${a.emoji} ${a.name} (${code})</option>`
  ).join('');
  document.getElementById('addName').value = '';
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
}

function addMember() {
  const name = document.getElementById('addName').value.trim();
  const code = document.getElementById('addType').value;
  if (!name) { showToast('이름을 입력해주세요!'); return; }

  const animal = animalTypes[code];
  const members = getMembers();
  const existing = members.findIndex(m => m.name === name);
  const entry = {
    name,
    code,
    emoji: animal.emoji,
    animalName: animal.name,
    axisPercent: null, // Manual add doesn't have detailed scores
    timestamp: new Date().toISOString()
  };
  if (existing >= 0) members[existing] = entry;
  else members.push(entry);
  setMembers(members);

  closeAddModal();
  renderBoard();
  showToast(`${name}님 추가됨!`);
}

function clearBoard() {
  if (!confirm('가족 보드를 초기화할까요?')) return;
  setMembers([]);
  renderBoard();
  showToast('초기화되었습니다.');
}

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
// ══════════════════════════════════════
// Wake Lock (화면 꺼짐 방지)
// ══════════════════════════════════════
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 지원 안 되는 브라우저 무시 */ }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

// 페이지 다시 보일 때 재요청 (탭 전환 후 복귀 시)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !wakeLock) {
    requestWakeLock();
  }
});

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  renderBoard();
  requestWakeLock();
});
</script>
